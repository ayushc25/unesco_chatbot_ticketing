<!-- templates/chat.html -->
<!DOCTYPE html>
<html>
<head>
    <title>UNESCO Ticketing Chatbot</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f0f0f0; }
        .chatbox { max-width: 600px; margin: auto; padding: 20px; background: white; border-radius: 10px; }
        .messages { min-height: 200px; padding: 10px; border: 1px solid #ccc; background: #fafafa; }
        input[type="text"] { width: 80%; padding: 10px; }
        button { padding: 10px; }
        .user { font-weight: bold; color: blue; }
        .bot { font-weight: bold; color: green; }
    </style>
</head>
<body>
    <div class="chatbox">
        <h2>🎟️ UNESCO Ticketing Chatbot</h2>
        <div class="messages" id="messages"></div>
        <input type="text" id="user_input" placeholder="Type your message here..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        function sendMessage() {
            const user_input = document.getElementById('user_input').value;
            const messages = document.getElementById('messages');

            messages.innerHTML += `<p><span class='user'>You:</span> ${user_input}</p>`;
            document.getElementById('user_input').value = '';

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: user_input })
            })
            .then(response => response.json())
            .then(data => {
                messages.innerHTML += `<p><span class='bot'>Bot:</span> ${data.response}</p>`;
            });
        }
    </script>
</body>
</html>
